---
# ==========================================
# 1. EMQX BROKER (Endpoint Prometheus Nativo)
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emqx-data
  namespace: default
spec:
  accessModes: [ ReadWriteOnce ]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: emqx
  namespace: default
spec:
  serviceName: emqx-headless
  replicas: 1
  selector:
    matchLabels:
      app: emqx
  template:
    metadata:
      labels:
        app: emqx
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: emqx
        image: docker.io/emqx/emqx:5.8
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1883
        - containerPort: 18083
        env:
        - name: EMQX_NODE__COOKIE
          value: "emqx-cookie-k8s"
        - name: EMQX_DASHBOARD__DEFAULT_USERNAME
          value: "admin"
        - name: EMQX_DASHBOARD__DEFAULT_PASSWORD
          value: "public"
        volumeMounts:
        - name: emqx-data
          mountPath: /opt/emqx/data
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits:   { cpu: 500m, memory: 1Gi }
        startupProbe:
          tcpSocket:
            port: 18083
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 18083
          periodSeconds: 15
      volumes:
      - name: emqx-data
        persistentVolumeClaim:
          claimName: emqx-data
---
apiVersion: v1
kind: Service
metadata:
  name: emqx-headless
  namespace: default
spec:
  clusterIP: None
  selector:
    app: emqx
  ports:
  - port: 1883
---
apiVersion: v1
kind: Service
metadata:
  name: emqx
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: emqx
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
  - name: dashboard
    port: 18083
    targetPort: 18083

---
# ==========================================
# 2. MQTT LATENCY PROBER (Mede RTT Real)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-latency-prober
  namespace: default
data:
  prober.py: |
    import paho.mqtt.client as mqtt
    import time
    import json
    from prometheus_client import start_http_server, Gauge, Histogram
    import os

    LATENCY_GAUGE = Gauge('mqtt_synthetic_rtt_ms', 'Latência RTT sintética em milissegundos')
    LATENCY_HIST = Histogram('mqtt_synthetic_rtt_histogram_ms', 'Distribuição da latência RTT', buckets=(10, 20, 50, 100, 200, 500, 1000))

    BROKER_HOST = os.getenv('MQTT_BROKER', 'emqx')
    BROKER_PORT = int(os.getenv('MQTT_PORT', 1883))
    TOPIC = "sys/monitoring/latency-test"

    def on_connect(client, userdata, flags, rc):
        print(f"Conectado ao broker {BROKER_HOST} com código {rc}")
        client.subscribe(TOPIC)

    def on_message(client, userdata, msg):
        try:
            payload = json.loads(msg.payload.decode())
            sent_time_ms = payload.get('ts')
            if sent_time_ms:
                current_time_ms = time.time() * 1000
                rtt_ms = current_time_ms - sent_time_ms
                LATENCY_GAUGE.set(rtt_ms)
                LATENCY_HIST.observe(rtt_ms)
        except Exception as e:
            print(f"Erro ao processar mensagem: {e}")

    start_http_server(8000)
    print("Servidor de métricas iniciado na porta 8000")

    client = mqtt.Client(client_id="latency-prober-k8s")
    client.on_connect = on_connect
    client.on_message = on_message
    
    client.connect(BROKER_HOST, BROKER_PORT, 60)
    client.loop_start()

    while True:
        try:
            msg = {"ts": time.time() * 1000}
            client.publish(TOPIC, json.dumps(msg), qos=1)
            time.sleep(2)
        except Exception as e:
            print(f"Erro no loop de envio: {e}")
            time.sleep(5)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-latency-prober
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-latency-prober
  template:
    metadata:
      labels:
        app: mqtt-latency-prober
    spec:
      containers:
      - name: prober
        image: python:3.9-slim
        command: ["sh", "-c", "pip install paho-mqtt prometheus-client && python /app/prober.py"]
        env:
        - name: MQTT_BROKER
          value: "emqx"
        - name: MQTT_PORT
          value: "1883"
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: script
          mountPath: /app/prober.py
          subPath: prober.py
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 100m, memory: 128Mi }
      volumes:
      - name: script
        configMap:
          name: mqtt-latency-prober
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-latency-prober
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: mqtt-latency-prober
  ports:
  - name: metrics
    port: 8000
    targetPort: 8000

---
# ==========================================
# 3. PROMETHEUS (Lê EMQX + Latency Prober)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    scrape_configs:
      - job_name: 'emqx-native-metrics'
        metrics_path: /api/v5/prometheus/stats
        scheme: http
        static_configs:
          - targets: ['emqx:18083']
      - job_name: 'mqtt-latency-prober'
        metrics_path: '/'
        static_configs:
          - targets: ['mqtt-latency-prober:8000']
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: default
spec:
  accessModes: [ ReadWriteOnce ]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: docker.io/prom/prometheus:latest
        imagePullPolicy: IfNotPresent
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=24h"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: data
          mountPath: /prometheus
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits:   { cpu: 300m, memory: 512Mi }
        startupProbe:
          httpGet: { path: /-/ready, port: 9090 }
          failureThreshold: 15
          periodSeconds: 3
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090

---
# ==========================================
# 4. GRAFANA
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: default
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: default
spec:
  accessModes: [ ReadWriteOnce ]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: docker.io/grafana/grafana:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-data
          mountPath: /var/lib/grafana
        resources:
          requests: { cpu: 200m, memory: 256Mi }
          limits:   { cpu: 500m, memory: 512Mi }
        startupProbe:
          httpGet: { path: /api/health, port: 3000 }
          failureThreshold: 15
          periodSeconds: 3
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-storage
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000